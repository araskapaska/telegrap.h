<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Статья - ТелеГраф</title>
  <style>
    body { font-family: sans-serif; max-width: 700px; margin: auto; padding: 20px; }
    h1, p { margin-bottom: 20px; }
    code { background: #eee; padding: 3px; font-family: monospace; display: block; margin-top: 4px; }
  </style>
</head>
<body>
  <h1 id="article-title">Заголовок статьи</h1>
  <p id="article-content">Здесь будет текст статьи...</p>
  <p id="article-info">Информация о статье</p>

  <script src="https://www.gstatic.com/firebasejs/9.1.2/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.1.2/firebase-database.js"></script>

  <script>
    // Конфигурация Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyBJrKrZjCIhkMOvJgpnQisuHOhj4AUcCCI",
      authDomain: "telegraph-ac33c.firebaseapp.com",
      projectId: "telegraph-ac33c",
      storageBucket: "telegraph-ac33c.firebasestorage.app",
      messagingSenderId: "113754095893",
      appId: "1:113754095893:web:07467e009ceeffa07f691c",
      measurementId: "G-E6DHRHTGJ4"
    };

    // Инициализация Firebase
    const firebaseApp = firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // Получаем slug из URL
    const urlParams = new URLSearchParams(window.location.search);
    const slug = urlParams.get('slug');

    if (slug) {
      const articleRef = database.ref('articles/' + slug);
      articleRef.once('value', (snapshot) => {
        const article = snapshot.val();
        if (article) {
          document.getElementById('article-title').textContent = article.title;
          document.getElementById('article-content').textContent = article.content;
          document.getElementById('article-info').innerHTML = `Дата публикации: ${new Date(article.created).toLocaleString()}`;
        } else {
          document.getElementById('article-title').textContent = 'Статья не найдена';
          document.getElementById('article-content').textContent = '';
          document.getElementById('article-info').textContent = '';
        }
      });
    }
  </script>
</body>
</html>
