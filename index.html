<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>ТелеГраф</title>
  <style>
    body { font-family: sans-serif; max-width: 700px; margin: auto; padding: 20px; }
    textarea, input { width: 100%; margin: 10px 0; padding: 10px; font-size: 16px; }
    button { padding: 10px 20px; font-size: 16px; }
    code { background: #eee; padding: 3px; font-family: monospace; display: block; margin-top: 4px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h1>ТелеГраф</h1>

  <div id="admin-panel" class="hidden">
    <h2>Создать статью</h2>
    <input id="title" placeholder="Заголовок статьи" />
    <textarea id="content" rows="10" placeholder="Текст статьи..."></textarea>
    <button onclick="createArticle()">Создать</button>
    <p id="result"></p>

    <h2>Мои статьи</h2>
    <div id="list"></div>
  </div>

  <!-- Firebase v8 SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBJrKrZjCIhkMOvJgpnQisuHOhj4AUcCCI",
      authDomain: "telegraph-ac33c.firebaseapp.com",
      projectId: "telegraph-ac33c",
      storageBucket: "telegraph-ac33c.firebasestorage.app",
      messagingSenderId: "113754095893",
      appId: "1:113754095893:web:07467e009ceeffa07f691c",
      measurementId: "G-E6DHRHTGJ4"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    const urlParams = new URLSearchParams(window.location.search);
    const isAdmin = urlParams.has('addminn') && urlParams.get('addminn') === 'true';

    if (isAdmin) {
      document.getElementById("admin-panel").classList.remove("hidden");
      loadArticles();
    }

    function createArticle() {
      const title = document.getElementById("title").value.trim();
      const content = document.getElementById("content").value.trim();
      if (!title || !content) return alert("Заполни оба поля");

      const date = new Date();
      const dateStr = `${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}-${String(date.getFullYear()).slice(2)}`;
      const slug = title.replace(/\s+/g, '-').replace(/[^a-zA-Zа-яА-Я0-9-]/g, '') + '-' + dateStr;

      const article = {
        title,
        content,
        slug,
        created: date.toISOString()
      };

      database.ref('articles/' + slug).set(article);
      document.getElementById("result").innerHTML = `✅ Ссылка: <code>${location.origin}/article.html?slug=${slug}</code>`;
      loadArticles();
    }

    function loadArticles() {
      const ref = database.ref('articles');
      ref.once('value', snapshot => {
        const data = snapshot.val();
        const list = document.getElementById("list");
        if (!data) {
          list.innerHTML = "<p>Пока нет статей</p>";
          return;
        }

        list.innerHTML = Object.values(data).map(a => `
          <p>
            <b>${a.title}</b><br>
            <code>${location.origin}/article.html?slug=${a.slug}</code>
            <small>Создано: ${new Date(a.created).toLocaleString()}</small>
          </p>
        `).join('');
      });
    }
  </script>
</body>
</html>
