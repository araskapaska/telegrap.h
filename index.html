<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>ТелеГраф</title>
  <style>
    body { font-family: sans-serif; max-width: 700px; margin: auto; padding: 20px; }
    textarea, input { width: 100%; margin: 10px 0; padding: 10px; font-size: 16px; }
    button { padding: 10px 20px; font-size: 16px; }
    code { background: #eee; padding: 3px; font-family: monospace; display: block; margin-top: 4px; }
  </style>
</head>
<body>
  <h1>ТелеГраф</h1>

  <!-- Панель для создания статьи, которая будет видна только админам -->
  <div id="admin-panel" class="hidden">
    <h2>Создать статью</h2>
    <input id="title" placeholder="Заголовок статьи" />
    <textarea id="content" rows="10" placeholder="Текст статьи..."></textarea>
    <button onclick="createArticle()">Создать</button>
    <p id="result"></p>

    <h2>Мои статьи</h2>
    <div id="list"></div>
  </div>

  <!-- Панель для отображения всех статей -->
  <div id="articles-list">
    <h2>Статьи</h2>
    <div id="list"></div>
  </div>

  <script>
    // Проверка на наличие параметра 'addminn=true' в URL
    const urlParams = new URLSearchParams(window.location.search);
    const isAdmin = urlParams.has('addminn') && urlParams.get('addminn') === 'true';

    // Если это админская ссылка, показываем панель для создания статьи
    if (isAdmin) {
      document.getElementById("admin-panel").classList.remove("hidden");
      loadArticles();
    }

    // Функция для создания статьи
    function createArticle() {
      const title = document.getElementById("title").value.trim();
      const content = document.getElementById("content").value.trim();
      if (!title || !content) return alert("Заполни оба поля");

      const date = new Date();
      const dateStr = `${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}-${String(date.getFullYear()).slice(2)}`;
      const slug = title.replace(/\s+/g, '-').replace(/[^a-zA-Zа-яА-Я0-9-]/g, '') + '-' + dateStr;

      const article = { title, content, slug, created: date.toISOString() };

      const all = JSON.parse(localStorage.getItem("articles") || "[]");
      all.push(article);
      localStorage.setItem("articles", JSON.stringify(all));

      document.getElementById("result").innerHTML = `✅ Ссылка: <code>${location.origin}/article.html?slug=${slug}</code>`;
      loadArticles();
    }

    // Функция для загрузки всех статей
    function loadArticles() {
      const all = JSON.parse(localStorage.getItem("articles") || "[]");
      const list = document.getElementById("list");
      if (!all.length) {
        list.innerHTML = "<p>Пока нет статей</p>";
        return;
      }
      list.innerHTML = all.map(a => `
        <p>
          <b>${a.title}</b><br>
          <code>${location.origin}/article.html?slug=${a.slug}</code>
          <small>Создано: ${new Date(a.created).toLocaleString()}</small>
        </p>
      `).join("");
    }
  </script>
</body>
</html>
